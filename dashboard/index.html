<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review Copilot</title>
<style>
  :root{--bg:#fafafa;--card:#fff;--tx:#1f1f1f;--mut:#6b6b6b;--red:#ea1d2c;--bd:#ececec;--ok:#2f9e5b;--warn:#e8a317}
  @media(prefers-color-scheme:dark){:root{--bg:#141414;--card:#1e1e1e;--tx:#f0f0f0;--mut:#9a9a9a;--bd:#2c2c2c}}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}
  header{background:var(--red);color:#fff;padding:22px 16px}
  .w{max-width:1000px;margin:0 auto;padding:0 16px}header .w{padding:0}
  h1{margin:0;font-size:22px}header p{margin:4px 0 0;opacity:.9;font-size:14px}
  main{padding:20px 0 40px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
  .k b{display:block;font-size:26px}.k span{color:var(--mut);font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
  h2{font-size:16px;margin:0 0 10px}
  .tag{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--bd);font-size:12px;margin-right:4px}
  .bad{color:var(--red)}.good{color:var(--ok)}
  .prob{margin:10px 0 0;padding-top:10px;border-top:1px solid var(--bd);font-size:14px}
  .bar{height:8px;border-radius:4px;background:var(--bd);overflow:hidden;margin:4px 0}
  .bar i{display:block;height:100%;background:var(--red)}
  svg{width:100%;height:120px}
  footer{color:var(--mut);font-size:12px;text-align:center;padding-bottom:24px}
</style>
</head>
<body>
<header><div class="w"><h1>Review Copilot</h1><p>Agente de IA que transforma avaliações em plano de ação por restaurante</p></div></header>
<main class="w">
  <div class="kpis" id="kpis"></div>
  <div class="card" style="margin-bottom:12px"><h2>Nota média por mês</h2><svg id="trend" viewBox="0 0 400 120" style="height:auto"></svg></div>
  <div class="grid" id="rests"></div>
</main>
<footer id="foot"></footer>
<script src="data.js"></script>
<script>
const D = window.DATA, $ = id => document.getElementById(id);
const avg = D.restaurantes.reduce((s,r)=>s+r.nota_media*r.avaliacoes,0)/D.total;
const worst = D.restaurantes[0];
$("kpis").innerHTML = [
  [D.total,"avaliações analisadas"],[avg.toFixed(2)+" ★","nota média geral"],
  [worst.nome,"restaurante em maior risco"],[worst.pct_negativas+"%","avaliações negativas (pior caso)"]
].map(([a,b])=>`<div class="card k"><b>${a}</b><span>${b}</span></div>`).join("");

// tendência (SVG simples, sem libs)
const t = D.tendencia, min = Math.min(...D.tendencia.map(x=>x.nota))-0.2, max = Math.max(...D.tendencia.map(x=>x.nota))+0.2;
const pts = t.map((p,i)=>[i*(400/(t.length-1||1)), 110-((p.nota-min)/(max-min))*100]);
$("trend").innerHTML = `<polyline fill="none" stroke="#ea1d2c" stroke-width="3" points="${pts.map(p=>p.join(",")).join(" ")}"/>` +
  pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#ea1d2c"/><text x="${Math.min(Math.max(p[0],20),380)}" y="${p[1]-8}" font-size="10" text-anchor="middle" fill="currentColor">${t[i].mes.slice(5)}/${t[i].nota}</text>`).join("");

$("rests").innerHTML = D.restaurantes.map(r=>{
  const max = Math.max(...r.problemas.map(p=>p.qtd),1);
  return `<div class="card"><h2>${r.nome}</h2>
  <span class="tag">${r.avaliacoes} avaliações</span><span class="tag ${r.nota_media<3.8?'bad':'good'}">${r.nota_media} ★</span><span class="tag">${r.pct_negativas}% negativas</span>
  ${r.problemas.map(p=>`<div class="prob"><b>${p.tema.replace('_',' ')}</b> · ${p.qtd} menções
  <div class="bar"><i style="width:${100*p.qtd/max}%"></i></div><span>💡 ${p.acao}</span></div>`).join("")}</div>`}).join("");
$("foot").textContent = `Classificação via: ${D.modo === "claude" ? "Claude (LLM)" : "regras (modo offline)"} · dados sintéticos`;
</script>
</body>
</html>
